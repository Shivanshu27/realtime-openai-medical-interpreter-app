services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-interpreter-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MOCK_MODE=${MOCK_MODE:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000}
      - MONGODB_URI=mongodb://mongodb:27017/medical-interpreter
      - MONGODB_DB_NAME=medical-interpreter
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - interpreter-network

  mongodb:
    image: mongo:6
    container_name: medical-interpreter-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=medical-interpreter
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - interpreter-network

networks:
  interpreter-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
